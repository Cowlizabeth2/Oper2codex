name: Build Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 30
    env:
      QT_QUICK_BACKEND: software
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and extract source bundle
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "oper-build"
          python tools/validate_bundle.py source_bundle.zip $work
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OPER_BUILD_ROOT=$work" >> $env:GITHUB_ENV
      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location $env:OPER_BUILD_ROOT
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          exit $LASTEXITCODE
      - name: Test services and native Windows clipboard
        shell: pwsh
        run: |
          Set-Location $env:OPER_BUILD_ROOT
          python tools/run_tests.py
          exit $LASTEXITCODE
      - name: Summarize Windows test results
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:OPER_BUILD_ROOT/tools/report_tests.py") {
            Set-Location $env:OPER_BUILD_ROOT
            python tools/report_tests.py
            exit $LASTEXITCODE
          }
      - name: Load all QML pages and block editors
        shell: pwsh
        run: |
          Set-Location $env:OPER_BUILD_ROOT
          python tools/run_smoke.py
          exit $LASTEXITCODE
      - name: Build and smoke-test packaged application
        shell: pwsh
        run: |
          Set-Location $env:OPER_BUILD_ROOT
          python tools/build_windows.py
          exit $LASTEXITCODE
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            ${{ env.OPER_BUILD_ROOT }}/artifacts/*.json
            ${{ env.OPER_BUILD_ROOT }}/artifacts/*.xml
            ${{ env.OPER_BUILD_ROOT }}/artifacts/*.txt
          if-no-files-found: ignore
      - name: Upload tested Windows package
        uses: actions/upload-artifact@v4
        with:
          name: OperationalCenter-Windows
          path: ${{ env.OPER_BUILD_ROOT }}/artifacts/OperationalCenter-Windows.zip
          if-no-files-found: error
      - name: Save machine-readable build report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const root = process.env.OPER_BUILD_ROOT;
            if (!root) return;
            const report = {commit: context.sha, run_id: context.runId, files: {}};
            for (const name of ['tests.xml', 'test-output.txt', 'test-exit-code.txt', 'source-smoke.json', 'source-output.txt', 'source-exit-code.txt', 'packaged-smoke.json', 'build-output.txt', 'packaged-output.txt']) {
              const source = path.join(root, 'artifacts', name);
              if (fs.existsSync(source)) report.files[name] = fs.readFileSync(source, 'utf8').slice(0, 250000);
            }
            const owner = context.repo.owner, repo = context.repo.repo;
            const branch = 'ci-diagnostics', file = 'ci-diagnostics/latest.json';
            try {
              await github.rest.git.getRef({owner, repo, ref: 'heads/' + branch});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({owner, repo, ref: 'refs/heads/' + branch, sha: context.sha});
            }
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner, repo, path: file, ref: branch});
              sha = current.data.sha;
            } catch (error) { if (error.status !== 404) throw error; }
            await github.rest.repos.createOrUpdateFileContents({owner, repo, path: file, branch, sha,
              message: 'Record Windows build diagnostics for ' + context.sha.slice(0, 8),
              content: Buffer.from(JSON.stringify(report, null, 2)).toString('base64')});
